spring:
  datasource:
    url: jdbc:mysql://localhost:3306/teaching_record?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
xfyun:
  app-id: ${XFYUN_APP_ID}
  api-key: ${XFYUN_API_KEY}
  api-secret: ${XFYUN_API_SECRET}
  upload-url: https://office-api-ist-dx.iflyaisol.com/v2/upload
  get-result-url: https://office-api-ist-dx.iflyaisol.com/v2/getResult
siliconflow:
  api-key: ${SILICONFLOW_API_KEY}